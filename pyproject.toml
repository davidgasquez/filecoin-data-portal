[project]
name = "fdp"
version = "2.0.0"
readme = "README.md"
authors = [{ name = "David Gasquez", email = "davidgasquez@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.0",
    "eth-utils>=6.0.0",
    "google-auth>=2.62.0",
    "google-cloud-bigquery>=3.46.2",
    "google-cloud-bigquery-storage>=2.43.0",
    "httpx>=0.28.1",
    "multiaddr>=0.2.0",
    "polars>=2.1.0",
    "pyarrow>=26.0.0",
    "pyoso>=0.10.0",
    "pytz>=2026.5",
    "web3>=8.0.0",
]

[project.scripts]
fdp = "fdp.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fdp"
module-root = ""

[dependency-groups]
dev = [
    "prek>=0.5.7",
    "ruff>=0.17.3",
    "ty>=0.0.93",
]

[tool.ruff]
preview = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle (error)
    "W",      # pycodestyle (warning)
    "F",      # pyflakes
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "I",      # isort
    "UP",     # pyupgrade
    "PIE",    # flake8-pie
    "PGH",    # pygrep-hooks
    "PYI",    # flake8-pyi
    "RUF",    # ruff
    "RUF067", # non-empty-init-module
]
