name: Pipeline

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 14 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline
    runs-on: ubuntu-latest
    env:
      ENCODED_GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.ENCODED_GOOGLE_APPLICATION_CREDENTIALS }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: d301192e601454a9cf7a87b4cd6ee243
      OSO_API_KEY: ${{ secrets.OSO_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false

      - name: Check assets
        run: uv run fdp check

      - name: Materialize
        run: uv run fdp materialize

      - name: Verify status
        run: uv run fdp status

      - name: Run data tests
        run: uv run fdp test

      - name: Export public DuckDB
        run: uv run fdp export --out build/fdp.duckdb

      - name: Publish to R2
        if: github.ref == 'refs/heads/main'
        run: uv run fdp publish r2

      - name: Publish DuckDB snapshot
        if: github.ref == 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
        run: |
          aws s3 cp build/fdp.duckdb "s3://$R2_BUCKET/fdp.duckdb" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --region auto --no-progress --cache-control no-cache

      # Keep this POC non-blocking: Website is triggered by Pipeline success.
      - name: Setup Node.js for ultrasoundstorage
        if: github.ref == 'refs/heads/main'
        id: ultrasound_node
        continue-on-error: true
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ultrasound/package-lock.json

      - name: Build and deploy ultrasoundstorage
        if: github.ref == 'refs/heads/main' && steps.ultrasound_node.outcome == 'success'
        id: ultrasound
        continue-on-error: true
        working-directory: ultrasound
        env:
          # Override the pipeline's cache-purge token with the Workers token.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
        run: |
          npm ci
          npm test
          npm run build
          npm run deploy

      - name: Report ultrasoundstorage failure
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (steps.ultrasound_node.outcome == 'failure' || steps.ultrasound.outcome == 'failure') }}
        run: |
          echo "::warning::ultrasoundstorage refresh failed; the previous deployment remains online."
          echo "⚠️ ultrasoundstorage refresh failed. Check the POC build/deploy step; the main portal is unaffected." >> "$GITHUB_STEP_SUMMARY"
