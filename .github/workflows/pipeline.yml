name: Pipeline

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 14 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline
    runs-on: ubuntu-latest
    env:
      ENCODED_GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.ENCODED_GOOGLE_APPLICATION_CREDENTIALS }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: d301192e601454a9cf7a87b4cd6ee243
      OSO_API_KEY: ${{ secrets.OSO_API_KEY }}
      FDP_FILECOIN_RPC_MAX_CONCURRENT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Check assets
        run: uv run fdp check

      - name: Materialize
        run: uv run fdp materialize

      - name: Verify status
        run: uv run fdp status

      - name: Run data tests
        run: uv run fdp test

      - name: Generate FDP docs
        run: uv run fdp docs --out build/fdp-docs

      - name: Upload FDP docs
        uses: actions/upload-artifact@v4
        with:
          name: fdp-docs
          path: build/fdp-docs
          retention-days: 30

      - name: Export public DuckDB
        run: uv run fdp export --out build/fdp.duckdb

      - name: Publish to R2
        if: github.ref == 'refs/heads/main'
        run: uv run fdp publish r2

      - name: Publish DuckDB snapshot
        if: github.ref == 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
        run: |
          aws s3 cp build/fdp.duckdb "s3://$R2_BUCKET/fdp.duckdb" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --region auto --no-progress --cache-control no-cache
