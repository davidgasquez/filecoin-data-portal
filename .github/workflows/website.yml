name: Website

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/website.yml"
  workflow_run:
    workflows: ["Pipeline"]
    branches: [main]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download FDP docs
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          run_id="${WORKFLOW_RUN_ID:-$(gh run list --workflow pipeline.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')}"
          gh run download "$run_id" --name fdp-docs --dir web/.generated/fdp-docs/raw

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0

      - name: Build
        run: npm ci --prefix web && npm run build --prefix web

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fbe814d4a37d3d3d7fcfeec0ab929ff6
        run: npx --yes wrangler@4.151.3 deploy --config web/wrangler.jsonc
