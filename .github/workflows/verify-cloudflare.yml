name: Verify Cloudflare

on:
  push:
    branches: [fix-cloudflare-cache]
    paths: [.github/workflows/verify-cloudflare.yml, .github/cloudflare-smoke.py]

jobs:
  purge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Verify publishing token can purge the dataset cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: d301192e601454a9cf7a87b4cd6ee243
        run: uv run .github/cloudflare-smoke.py
